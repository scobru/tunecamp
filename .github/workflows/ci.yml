name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The "zen" dependency is a git dependency resolved via git+ssh in the
      # lockfile; CI runners have no SSH keys, so rewrite to anonymous HTTPS.
      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server (tsc)
        run: npm run build

      - name: Run tests
        run: npm test

  webapp:
    name: Webapp build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lockfile is generated on Windows, so npm ci skips Linux native
      # binaries (npm optional-deps bug, npm/cli#4828). Same workaround as
      # the Dockerfile, with -gnu variants instead of -musl.
      - name: Install Linux native binaries (rollup, lightningcss, tailwind)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Check i18n catalogs (missing/orphan keys)
        run: npm run i18n:check -w webapp

      - name: Run webapp tests (vitest)
        run: npm run test:run -w webapp

      - name: Build webapp (tsc + vite)
        run: npm run build -w webapp

  # Promotion gate: `dev` is the integration branch. Once a push to `dev` passes
  # both build/test jobs above (that's the "green" gate via `needs`), check how far
  # `dev` is ahead of `main`. When it reaches PROMOTE_THRESHOLD commits, open a
  # `dev → main` pull request so the batch can be reviewed and merged (released).
  # Merging into `main` stays a human/automerge decision — this only prepares it.
  promote:
    name: Promote dev → main
    needs: [server, webapp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open dev → main promotion PR when enough green commits accumulated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How many green commits must accumulate on `dev` beyond `main` before a
          # promotion PR is opened. Bump this to release less often, lower it for more.
          PROMOTE_THRESHOLD: "5"
        run: |
          set -euo pipefail
          git fetch --quiet origin main dev
          AHEAD=$(git rev-list --count origin/main..origin/dev)
          echo "dev is $AHEAD commit(s) ahead of main (threshold: $PROMOTE_THRESHOLD)."

          if [ "$AHEAD" -lt "$PROMOTE_THRESHOLD" ]; then
            echo "Below threshold — not promoting yet."
            exit 0
          fi

          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing is already open; it tracks dev automatically as new commits land."
            exit 0
          fi

          gh pr create --base main --head dev \
            --title "Promote dev → main ($AHEAD commits)" \
            --body "Automated promotion: **dev** reached **$AHEAD** commits ahead of **main** with green CI (server + webapp). Review and merge to cut a release."
          echo "Opened promotion PR dev → main."
