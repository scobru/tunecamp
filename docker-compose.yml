# TuneCamp Docker Compose Configuration
# Usage: docker-compose up -d

services:
  tunecamp:
    build:
      context: .
      args:
        - TUNECAMP_RPC_URL=${TUNECAMP_RPC_URL:-https://mainnet.base.org}
        - TUNECAMP_CURRENCY_CONTRACT=${TUNECAMP_CURRENCY_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
        - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
        - TUNECAMP_DOWNLOAD_DIR=${TUNECAMP_DOWNLOAD_DIR:-/data/downloads}
    image: tunecamp:latest
    container_name: tunecamp
    ports:
      - "1970:1970"
    volumes:
      # Map your music library (REQUIRED - change this path)
      - /path/to/your/music:/music:ro
      # Persistent data (database, uploads)
      - tunecamp_data:/data
    environment:
      # Base Mainnet RPC
      - TUNECAMP_RPC_URL=https://mainnet.base.org
      # Base Network Currency Contract (e.g. USDC)
      - TUNECAMP_CURRENCY_CONTRACT=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
      # Optional: Set public URL for community registration
      - TUNECAMP_PUBLIC_URL=https://sudorecords.scobrudot.dev/
      # Optional: Site name for community
      - TUNECAMP_SITE_NAME=My TuneCamp Server
      # Optional: JWT secret (auto-generated if not set)
      - JWT_SECRET=
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - TUNECAMP_DOWNLOAD_DIR=${TUNECAMP_DOWNLOAD_DIR:-/data/downloads}
      # ZEN Relay peer - must use /zen WebSocket path
      - TUNECAMP_ZEN_PEERS=${TUNECAMP_ZEN_PEERS:-wss://delay.scobrudot.dev/zen}
      - VITE_ZEN_PEERS=${TUNECAMP_ZEN_PEERS:-wss://delay.scobrudot.dev/zen}
      # Telegram Integration
      - TUNECAMP_TELEGRAM_BOT_TOKEN=
      - TUNECAMP_TELEGRAM_MASTER_ID=
      # OpenRouter AI Integration
      - OPENROUTER_API_KEY=
      - OPENROUTER_MODEL=openai/gpt-4o-mini
      # Payments: Stripe
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
      - STRIPE_ONRAMP_SECRET_KEY=
      # Payments: PayPal
      - PAYPAL_CLIENT_ID=
      - PAYPAL_CLIENT_SECRET=
      - PAYPAL_ENVIRONMENT=sandbox
      # Payments: MoonPay
      - MOONPAY_API_KEY=
      # Spotify Integration
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # YouTube Bot Detection Bypass
      - YOUTUBE_COOKIES_PATH=${YOUTUBE_COOKIES_PATH:-}
      # Scrobbling
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN:-}
    restart: unless-stopped
    # Optional: healthcheck configured in Dockerfile

volumes:
  tunecamp_data:
    driver: local
