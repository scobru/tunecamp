# TuneCamp Docker Compose Configuration
# Quick start:
#   docker-compose up -d --build
#
# Default web UI: http://localhost:1970 (Admin: admin / admin)

services:
  tunecamp:
    build:
      context: .
      args:
        - TUNECAMP_RPC_URL=${TUNECAMP_RPC_URL:-https://mainnet.base.org}
        - TUNECAMP_CURRENCY_CONTRACT=${TUNECAMP_CURRENCY_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
        - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
        - TUNECAMP_DOWNLOAD_DIR=${TUNECAMP_DOWNLOAD_DIR:-/data/downloads}
    image: tunecamp:latest
    container_name: tunecamp
    ports:
      - "${TUNECAMP_PORT:-1970}:1970"
    volumes:
      # Map your music library (defaults to ./music in current directory or set TUNECAMP_MUSIC_PATH)
      - ${TUNECAMP_MUSIC_PATH:-./music}:/music
      # Persistent data (SQLite database, downloaded content, uploads)
      - tunecamp_data:/data
    env_file:
      - .env
    environment:
      # Core Paths & Port
      - NODE_ENV=production
      - TUNECAMP_PORT=1970
      - TUNECAMP_MUSIC_DIR=/music
      - TUNECAMP_DB_PATH=/data/tunecamp.db
      - TUNECAMP_DOWNLOAD_DIR=${TUNECAMP_DOWNLOAD_DIR:-/data/downloads}
      # Initial Admin credentials (change upon first login)
      - TUNECAMP_ADMIN_USER=${TUNECAMP_ADMIN_USER:-admin}
      - TUNECAMP_ADMIN_PASS=${TUNECAMP_ADMIN_PASS:-admin}
      # Network & Federation
      - TUNECAMP_PUBLIC_URL=${TUNECAMP_PUBLIC_URL:-}
      - TUNECAMP_SITE_NAME=${TUNECAMP_SITE_NAME:-TuneCamp}
      - TUNECAMP_JWT_SECRET=${TUNECAMP_JWT_SECRET:-}
      - TUNECAMP_FEDERATION_SEEDS=${TUNECAMP_FEDERATION_SEEDS:-}
      # Web3 / Payments (Base Network)
      - TUNECAMP_RPC_URL=${TUNECAMP_RPC_URL:-https://mainnet.base.org}
      - TUNECAMP_CURRENCY_CONTRACT=${TUNECAMP_CURRENCY_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
      - TUNECAMP_OWNER_ADDRESS=${TUNECAMP_OWNER_ADDRESS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_ONRAMP_SECRET_KEY=${STRIPE_ONRAMP_SECRET_KEY:-}
      # Integrations & Metadata
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - TUNECAMP_TELEGRAM_BOT_TOKEN=${TUNECAMP_TELEGRAM_BOT_TOKEN:-}
      - TUNECAMP_TELEGRAM_MASTER_ID=${TUNECAMP_TELEGRAM_MASTER_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - TUNECAMP_GDRIVE_CLIENT_ID=${TUNECAMP_GDRIVE_CLIENT_ID:-}
      - TUNECAMP_GDRIVE_CLIENT_SECRET=${TUNECAMP_GDRIVE_CLIENT_SECRET:-}
      # Email & Monitoring
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:1970/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  tunecamp_data:
    driver: local
